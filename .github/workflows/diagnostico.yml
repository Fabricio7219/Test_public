name: Diagnostico temporario
on: push
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U=https://restful-booker.herokuapp.com
          A=$(curl -s -o /tmp/a -w "%{http_code}" -X POST $U/auth -H "Content-Type: application/json" -d '{"username":"admin","password":"x"}')
          echo "::warning title=diag::auth-invalida $A $(cat /tmp/a)"
          T=$(curl -s -X POST $U/auth -H "Content-Type: application/json" -d '{"username":"admin","password":"password123"}' | sed 's/.*"token":"\([^"]*\)".*/\1/')
          ID=$(curl -s -X POST $U/booking -H "Content-Type: application/json" -H "Accept: application/json" -d '{"firstname":"A","lastname":"B","totalprice":1,"depositpaid":true,"bookingdates":{"checkin":"2026-11-01","checkout":"2026-11-02"}}' | sed 's/.*"bookingid":\([0-9]*\).*/\1/')
          D=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE $U/booking/$ID -H "Cookie: token=$T")
          echo "::warning title=diag::delete $D"
