name: Diagnostico temporario
on: push
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Variacoes de header no POST /booking
        run: |
          B='{"firstname":"A","lastname":"B","totalprice":1,"depositpaid":true,"bookingdates":{"checkin":"2026-11-01","checkout":"2026-11-02"},"additionalneeds":"x"}'
          U=https://restful-booker.herokuapp.com/booking
          t() { c=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$U" -d "$B" "$@"); echo "::warning title=diag::$c <- $*"; }
          t -H "Content-Type: application/json" -H "Accept: application/json"
          t -H "Content-Type: application/json; charset=UTF-8" -H "Accept: application/json"
          t -H "Content-Type: application/json" -H "Accept: application/json, application/javascript, text/javascript, text/json"
          t -H "Content-Type: application/json"
